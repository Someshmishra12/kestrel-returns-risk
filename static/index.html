<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Kestrel returns risk</title>
<style>body{font:15px system-ui;max-width:760px;margin:24px auto;padding:0 12px}label{display:block;margin:6px 0 2px;font-size:13px;color:#444}
input,select{width:100%;padding:6px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}button{margin:14px 0;padding:10px 18px;font-size:15px}
.r{border:1px solid #ccc;border-radius:8px;padding:14px;margin-top:10px}.hi{border-color:#c0392b;background:#fdf1ef}.lo{border-color:#2e8b57;background:#eef8f2}</style>
<h2>Kestrel — order return risk</h2><p>Fill an order as it looks at dispatch, press Score.</p>
<div class=g id=f></div><button onclick=go()>Score</button><div id=out></div>
<script>
const F={order_placed_at:"2026-09-20T10:30",customer_id:"KC104433",sku:"KH-RV-02",sales_channel:["marketplace","app","web","partner_outlet"],payment_mode:["cod","prepaid_upi","prepaid_card","emi"],discount_pct:20,qty:1,order_value_inr:18000,promised_delivery_days:8,delivery_pincode:440365,is_gift:["N","Y"],customer_prior_orders:3,customer_prior_returns:2,delivery_note:""};
const f=document.getElementById('f');for(const[k,v]of Object.entries(F)){f.insertAdjacentHTML('beforeend',`<div><label>${k}</label>${Array.isArray(v)?`<select id=${k}>${v.map(x=>`<option>${x}`).join('')}</select>`:`<input id=${k} value="${v}">`}</div>`)}
async function go(){const o={};for(const k in F){let v=document.getElementById(k).value;if(typeof F[k]=='number')v=Number(v);if(k=='delivery_note'&&!v)v=null;o[k]=v}
 let r;try{r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})}catch(e){out.innerHTML='<div class=r>Service not reachable.</div>';return}
 const j=await r.json();if(!r.ok){out.innerHTML=`<div class=r>Could not score: ${JSON.stringify(j.detail)}</div>`;return}
 const hi=j.recommended_action!='ship';out.innerHTML=`<div class="r ${hi?'hi':'lo'}"><b style="font-size:20px">${(j.return_probability*100).toFixed(1)}% chance of return</b><br>Action: <b>${j.recommended_action.replaceAll('_',' ')}</b> (no hold)<br>${j.explanation}<ul>${j.reasons.map(x=>`<li>${x.text} <i>(${x.effect})</i>`).join('')}</ul><small>${j.model_note}</small></div>`}
</script>
